[project]
name = "dictdiffer"
description = "Dictdiffer is a library that helps you to diff and patch dictionaries."
readme = "README.rst"
requires-python = ">=3.7"
license = "MIT"
authors = [
  { name = "Invenio Collaboration", email = "info@inveniosoftware.org" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.5",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/inveniosoftware/dictdiffer/blob/master/CHANGES"
Docs = "https://dictdiffer.rtfd.io/"
Homepage = "https://github.com/inveniosoftware/dictdiffer"

[project.optional-dependencies]
docs = [
  "sphinx-rtd-theme>=0.2",
  "sphinx>=3",
]
numpy = [
  "numpy>=1.20.0",
]
tests = [
  "mock>=1.3.0",
  "pycodestyle>=2.10.0",
  "pytest-cov>=2.10.1",
  "pytest-isort>=1.2.0",
  "pytest-pydocstyle>=2.2.0",
  "pytest>=6,<9",
  "sphinx>=3",
  "tox>=3.7.0",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dictdiffer/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/dictdiffer",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = ""

[tool.pytest.ini_options]
addopts = '--isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=dictdiffer --cov-report=term-missing'
testpaths = "tests dictdiffer"
live_server_scope = "module"
